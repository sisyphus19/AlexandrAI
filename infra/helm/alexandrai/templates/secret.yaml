apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alexandrai.fullname" . }}-secrets
  labels:
    {{- include "alexandrai.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: "alexandrai-production-secret-key-must-be-32bytes-long"
  DATABASE_URL: {{ .Values.database.url | quote }}
